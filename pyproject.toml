[project]
name = "free-video-downloader"
version = "0.1.0"
description = "A Linux desktop video and audio downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.11.2",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
free-video-downloader = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*.svg"]
